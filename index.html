<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlipMyFilm — Fine Art 35mm Negatives</title>
  <link rel="icon" type="image/x-icon" href="icon.ico">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

  <img src="1.jpg" alt="Sample 1" class="corner-img top-left">
  <img src="2.jpg" alt="Sample 2" class="corner-img top-right">
  <img src="3.jpg" alt="Sample 3" class="corner-img bottom-left">
  <img src="4.jpg" alt="Sample 4" class="corner-img bottom-right">

  <main class="page-wrapper">
    <header class="hero-section">
      <span class="subtitle">35mm Scan Correction Studio</span>
      <h1>FlipMyFilm</h1>
      <p class="description">
        Restore your inverted film laboratory scans to their proper orientation. 
        Select individual frame captures or entire scan directories to apply an exact 180-degree rotation.
      </p>
      <div class="divider"></div>
    </header>

    <section class="upload-section">
      <div class="button-group">
        <label class="btn">
          Select Individual Scans
          <input type="file" id="fileInput" multiple accept="image/*">
        </label>
        <label class="btn">
          Select Folder
          <input type="file" id="folderInput" webkitdirectory directory multiple accept="image/*">
        </label>
      </div>

      <div id="loader" class="loader-container hidden">
        <div class="spinner"></div>
        <p id="loaderStatus">Processing Scans...</p>
      </div>
    </section>

    <section class="gallery-section">
      <div class="action-bar">
        <button id="downloadAllBtn" class="btn primary" disabled>Download Zip Archive</button>
      </div>
      <div id="gallery" class="gallery"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
