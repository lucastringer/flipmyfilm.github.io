<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Negative Flipper</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>35mm Photo Flipper</h1>
    <p>Upload your scanned photos to flip them 180° automatically.</p>

    <div class="controls">
      <label class="btn">
        Select Files
        <input type="file" id="fileInput" multiple accept="image/*">
      </label>
      <label class="btn">
        Select Folder
        <input type="file" id="folderInput" webkitdirectory directory multiple accept="image/*">
      </label>
      <button id="downloadAllBtn" class="btn primary" disabled>Download All as ZIP</button>
    </div>

    <div id="gallery" class="gallery"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
